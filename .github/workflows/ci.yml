name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          install-mode: "goinstall"
      - name: Unit tests
        run: go test ./...
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: NPM package test
        run: node npm/test.js

  container:
    name: Integration (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      # internal/container manages its own docker lifecycle (start/stop/idempotent)
      # with tool-owned names/ports. Runs WITHOUT service containers so its
      # published ports (14330/54320) can't collide with anything else.
      - name: Container integration tests
        run: go test -tags=integration -p 1 ./internal/container/... -count=1

  integration:
    name: Integration (${{ matrix.db }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Oldest and newest of each supported version window
      # (docs/adr/003-v0.7-native-runner.md). Catalog rendering and DDL
      # behaviour are not stable across majors, and the differences cluster
      # at the boundaries — testing one version in the middle is what let
      # #78 and #84 ship.
      matrix:
        include:
          - db: postgres
            version: "15"
          - db: postgres
            version: "18"
          - db: mysql
            version: "8.0"
          - db: mysql
            version: "8.4"
          - db: mssql
            version: "2019"
          - db: mssql
            version: "2022"
          - db: sqlite
            version: "3"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.db == 'mssql' && matrix.version || '2022' }}-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.DBTOOLS_TEST_MSSQL_SA_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        # Readiness is checked without credentials: SQL Server logs
        # "Recovery is complete" to the error log once it accepts logins.
        # (A `-P $VAR` health check is unreliable here — the runner leaves
        # `$$` for the container shell, where `$$` is the PID.)
        options: >-
          --health-cmd "bash -c 'grep -q \"Recovery is complete\" /var/opt/mssql/log/errorlog || exit 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:${{ matrix.db == 'postgres' && matrix.version || '17' }}-alpine
        env:
          POSTGRES_USER: dbtools
          POSTGRES_PASSWORD: dbtools
          POSTGRES_DB: dbtools_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbtools"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:${{ matrix.db == 'mysql' && matrix.version || '8.0' }}
        env:
          MYSQL_ROOT_PASSWORD: dbtools
          MYSQL_DATABASE: dbtools_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      # The stock MSSQL image ships no user databases; the integration
      # suite expects one named `dbtools`. Create it inside the service
      # container (sqlcmd lives only there, not on the runner host).
      - name: Create MSSQL test database
        if: matrix.db == 'mssql'
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.DBTOOLS_TEST_MSSQL_SA_PASSWORD }}
        run: |
          image="mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest"
          container_id=$(docker ps -q --filter "ancestor=$image" | head -1)
          # 2019 images ship sqlcmd under mssql-tools; 2022 under
          # mssql-tools18, which also requires -C to trust the self-signed
          # certificate.
          if docker exec "$container_id" test -x /opt/mssql-tools18/bin/sqlcmd; then
            sqlcmd="/opt/mssql-tools18/bin/sqlcmd"; trust="-C"
          else
            sqlcmd="/opt/mssql-tools/bin/sqlcmd"; trust=""
          fi
          docker exec "$container_id" "$sqlcmd" \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" $trust \
            -Q "IF DB_ID('dbtools') IS NULL CREATE DATABASE dbtools" -b
      - name: Integration tests
        env:
          DBTOOLS_TEST_MSSQL_URL: ${{ matrix.db == 'mssql' && format('mssql://sa:{0}@localhost:1433?database=dbtools&TrustServerCertificate=true', secrets.DBTOOLS_TEST_MSSQL_SA_PASSWORD) || '' }}
          DBTOOLS_TEST_POSTGRES_URL: ${{ matrix.db == 'postgres' && 'postgres://dbtools:dbtools@localhost:5432/dbtools_test?sslmode=disable' || '' }}
          DBTOOLS_TEST_SQLITE_URL: ${{ matrix.db == 'sqlite' && 'sqlite:///tmp/dbtools-it.db' || '' }}
          DBTOOLS_TEST_MYSQL_URL: ${{ matrix.db == 'mysql' && 'mysql://root:dbtools@tcp(localhost:3306)/dbtools_test?parseTime=true&multiStatements=true' || '' }}
        run: |
          case "${{ matrix.db }}" in
            mssql)
              # internal/container has its own docker lifecycle (container job);
              # exclude it here to avoid colliding with the service containers.
              go test -tags=integration -p 1 $(go list ./... | grep -v '/internal/container$') -count=1
              ;;
            postgres|sqlite)
              # Full sweep, not just this engine's package: diff, squash and
              # the runner are where cross-version behaviour actually shows
              # up, and running only the engine package is how #78 and #84
              # reached a release.
              go test -tags=integration -p 1 $(go list ./... | grep -v '/internal/container$') -count=1
              ;;
            mysql)
              # dblock too: its GET_LOCK mutual-exclusion test skips unless
              # DBTOOLS_TEST_MYSQL_URL is set, so running only the engine
              # package left the MySQL half of the migration lock untested
              # on both advertised versions.
              go test -tags=integration -p 1 ./internal/engine/mysqlengine/... ./internal/dblock/... -count=1
              ;;
          esac

  docker-smoke:
    name: Docker image smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@latest
      - name: Build a local snapshot binary
        run: goreleaser build --single-target --snapshot --clean
      - name: Stage the binary where the Dockerfile expects it
        run: |
          bin=$(find dist -maxdepth 2 -name dbtools -type f | head -1)
          if [ -z "$bin" ]; then
            echo "::error::no dbtools binary found under dist/ after goreleaser build"
            exit 1
          fi
          cp "$bin" ./dbtools
      - name: Build the image
        run: docker build -t dbtools-smoke .
      - name: Run it
        run: docker run --rm dbtools-smoke --help

