name: Bug Report
description: File a reproducible bug or issue with dbtools
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with dbtools! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened when running dbtools?
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database Engine
      description: Which database engine is affected?
      options:
        - SQLite
        - PostgreSQL
        - MSSQL (SQL Server)
        - Multiple / CLI core
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: "Go version, OS, and dbtools version"
      placeholder: "e.g., dbtools v0.1.0, Go 1.25.0, Ubuntu 24.04 (Linux x86_64)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Initialize project with `dbtools init`
        2. Create migration `dbtools new my_table`
        3. Run `dbtools up`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs
      description: Paste relevant command output or logs here. Please redact passwords or secrets.
      render: shell
