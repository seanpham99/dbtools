version: 2

project_name: dbtools

builds:
  - id: dbtools
    main: .
    binary: dbtools
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/seanpham99/dbtools/cmd.version={{.Version}} -X github.com/seanpham99/dbtools/cmd.commit={{.Commit}} -X github.com/seanpham99/dbtools/cmd.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

dockers:
  - image_templates:
      - "ghcr.io/seanpham99/dbtools:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/seanpham99/dbtools:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/seanpham99/dbtools:{{ .Version }}"
    image_templates:
      - "ghcr.io/seanpham99/dbtools:{{ .Version }}-amd64"
      - "ghcr.io/seanpham99/dbtools:{{ .Version }}-arm64"
  - name_template: "ghcr.io/seanpham99/dbtools:latest"
    image_templates:
      - "ghcr.io/seanpham99/dbtools:{{ .Version }}-amd64"
      - "ghcr.io/seanpham99/dbtools:{{ .Version }}-arm64"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  groups:
    - title: "Features"
      regexp: "^feat(\\([[:word:]]+\\))?!?:"
      order: 0
    - title: "Bug fixes"
      regexp: "^(fix|perf)(\\([[:word:]]+\\))?!?:"
      order: 1
    - title: "Refactors"
      regexp: "^refactor:"
      order: 2
    - title: "Other changes"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
